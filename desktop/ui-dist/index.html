<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Jarv Genie</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #0d1117; color: #c9d1d9; font: 15px -apple-system, system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; height: 100vh;
  }
  .box { text-align: center; max-width: 30em; padding: 2em; }
  .spinner {
    width: 2.4em; height: 2.4em; margin: 0 auto 1.2em; border-radius: 50%;
    border: 3px solid #30363d; border-top-color: #58a6ff; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  code { color: #79c0ff; }
</style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <div id="msg">Starting the Jarv Genie hub&hellip;</div>
</div>
<script>
  const HUB = 'http://127.0.0.1:3001';
  async function tryHub() {
    try {
      const res = await fetch(HUB + '/api/status');
      if (res.ok || res.status === 401) return true;
    } catch { /* hub not up yet */ }
    return false;
  }
  (async () => {
    for (let i = 0; i < 60; i++) {
      if (await tryHub()) { location.replace(HUB); return; }
      await new Promise((r) => setTimeout(r, 1000));
    }
    document.getElementById('msg').innerHTML =
      'The hub did not start. Run <code>jarv-genie hub</code> in a terminal, then open this app again.';
  })();
</script>
</body>
</html>
