[package]
name = "jarv-genie-desktop"
version = "0.1.0"
description = "Native dock shell for the Jarv Genie hub"
edition = "2021"

[lib]
name = "jarv_genie_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
